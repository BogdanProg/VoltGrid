syntax = "proto3";

package voltgrid.station.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "VoltGrid.Contracts.Station.V1";

service StationLink {
  rpc Connect(stream StationMessage) returns (stream ServerMessage);
}

message StationMessage{
  string message_id = 1;
  oneof payload{
    BootNotification boot_notification = 2;
    Heartbeat heartbeat = 3;
  }
}

message ServerMessage{
  string message_id = 1;
  oneof payload{
    BootNotificationResponse boot_notification_response = 2;
    ErrorResponse error = 3;
    HeartbeatResponse heartbeat_response = 4;
  }
}

enum RegistrationStatus{
  REGISTRATION_STATUS_UNSPECIFIED = 0;
  REGISTRATION_STATUS_ACCEPTED = 1;
  REGISTRATION_STATUS_REJECTED = 2;
  REGISTRATION_STATUS_PENDING = 3;
}

enum ErrorCode{
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NOT_ACCEPTED = 1;
}

message ErrorResponse{
  ErrorCode code = 1;
}

message BootNotification{
  string model = 1;
  string serial_number = 2;
  string firmware_version = 3;
}

message BootNotificationResponse{
  RegistrationStatus status = 1;
  // ACCEPTED: send Heartbeat at this interval.
  // PENDING / REJECTED: retry BootNotification after this delay.
  int32 heartbeat_interval_seconds = 2;
  google.protobuf.Timestamp current_time = 3;
}

message Heartbeat{}

message HeartbeatResponse{
  google.protobuf.Timestamp current_time = 1;
}